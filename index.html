<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Formatter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Text Formatter</h1>
            <div class="api-key-section">
                <label for="api-key">Gemini API Key:</label>
                <input type="password" id="api-key" placeholder="Enter your Gemini API Key">
                <p class="api-key-notice">Your API key is stored in session storage and used only for calls to Google's Gemini API.</p>
            </div>
        </header>

        <main>
            <div class="input-section">
                <h2>Input Text</h2>
                <textarea id="input-text" placeholder="Enter your text here..."></textarea>
            </div>

            <div class="actions-section">
                <h2>Choose Action</h2>
                <button class="action-button" data-action="improve">Improve General Text</button>
                <button class="action-button" data-action="linkedin">Format for LinkedIn</button>
                <button class="action-button" data-action="twitter">Format for Twitter/X (Single Tweet)</button>
                <!-- Add more actions here as needed -->
            </div>

            <div class="output-section">
                <h2>Formatted Output</h2>
                <div id="output-text-container">
                    <pre id="output-text"></pre>
                </div>
                <button id="copy-output-button">Copy to Clipboard</button>
                <p id="status-message"></p>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 AI Text Formatter</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
